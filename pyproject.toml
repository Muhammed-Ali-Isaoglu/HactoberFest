[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "actiongate"
version = "0.1.0"
description = "Task-scoped least-privilege authorization gate for AI agents (research prototype)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.5",
  "uvicorn[standard]>=0.32.1",
  "pydantic>=2.10.3",
  "pydantic-settings>=2.6.1",
  "httpx>=0.28.1",
  "psycopg[binary]>=3.2.10",
  "streamlit>=1.41.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.4", "pytest-asyncio>=0.24.0", "ruff>=0.8.4"]

[tool.setuptools.packages.find]
include = ["api*", "core*", "agent*", "tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs running PostgreSQL (set DATABASE_URL)"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# FastAPI dependency injection uses Depends() in defaults by design.
per-file-ignores = { "api/main.py" = ["B008"] }
