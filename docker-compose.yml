# Full stack: PostgreSQL, Ollama with Gemma, the API and the Streamlit UI.
# Start with: docker compose up --build
# Ports are bound to 127.0.0.1 only. Ollama is internal to the compose network.

services:
  db:
    image: postgres:16.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: actiongate_demo
      POSTGRES_USER: actiongate_admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?set POSTGRES_ADMIN_PASSWORD in .env}
      ACTIONGATE_READER_PASSWORD: ${ACTIONGATE_READER_PASSWORD:?set ACTIONGATE_READER_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - ./data/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U actiongate_admin -d actiongate_demo"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  ollama:
    image: ollama/ollama:0.34.4
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Downloads the model once into the ollama-models volume, then exits.
  ollama-pull:
    image: ollama/ollama:0.34.4
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma3:4b}
    entrypoint: ["/bin/sh", "-c", "ollama pull $$OLLAMA_MODEL"]
    restart: "no"

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://actiongate_reader:${ACTIONGATE_READER_PASSWORD}@db:5432/actiongate_demo
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma3:4b}
      DEMO_OPERATOR_TOKEN: ${DEMO_OPERATOR_TOKEN:?set DEMO_OPERATOR_TOKEN in .env}
      ACTIONGATE_DB_PATH: /app/data/actiongate.sqlite3
      OUTBOX_PATH: /app/data/outbox.jsonl
    volumes:
      - ./data/api:/app/data
    ports:
      - "127.0.0.1:8000:8000"

  ui:
    build: .
    restart: unless-stopped
    depends_on:
      - api
    environment:
      ACTIONGATE_API_URL: http://api:8000
    command: ["streamlit", "run", "ui/app.py", "--server.address=0.0.0.0", "--server.port=8501"]
    ports:
      - "127.0.0.1:8501:8501"

volumes:
  ollama-models:
