# Default: the public demo only (one container, no model, no database).
#   docker compose up --build        -> http://localhost:8501
#
# Optional full stack (Gemma via Ollama + PostgreSQL read-only role). Heavy; needs a strong machine:
#   docker compose --profile full up --build
name: actiongate

services:
  app:
    build: .
    ports:
      - "127.0.0.1:8501:8501"
    env_file:
      - path: .env
        required: false
    environment:
      PLANNER: scripted
      SALES_BACKEND: memory

  db:
    profiles: ["full"]
    image: postgres:16.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: actiongate_demo
      POSTGRES_USER: actiongate_admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?set POSTGRES_ADMIN_PASSWORD in .env}
      ACTIONGATE_READER_PASSWORD: ${ACTIONGATE_READER_PASSWORD:?set ACTIONGATE_READER_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - ./data/pgdata:/var/lib/postgresql/data

  ollama:
    profiles: ["full"]
    image: ollama/ollama:0.34.4
    volumes:
      - ollama-models:/root/.ollama

volumes:
  ollama-models:
